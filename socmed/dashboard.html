<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media UI</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f2f5;
        }
        .container {
            display: flex;
            width: 90%;
            max-width: 1400px;
            height: 90vh;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .sidebar {
            width: 20%;
            background: #4c60af;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .sidebar h2 {
            margin-bottom: 15px;
        }
        .sidebar ul li {
            list-style: none;
            padding: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .sidebar ul li:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }
        .main-content {
            flex: 1;
            padding: 20px;
            background: #f5f5f5;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        header input {
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        header button {
            padding: 10px 15px;
            border: none;
            background: #4c60af;
            color: white;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        header button:hover {
            background: #3b4d8f;
        }
        .stories {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            overflow-x: auto;
        }
        .story {
            background: #ddd;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .post {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .post h3 {
            margin-bottom: 10px;
        }
        .post p {
            font-size: 14px;
            margin-bottom: 10px;
        }
        .post img {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }
        .post-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .post-actions button {
            padding: 10px 15px;
            border: none;
            background: #4c60af;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .post-actions button:hover {
            background: #3b4d8f;
        }
        .right-sidebar {
            width: 20%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .right-sidebar ul li {
            list-style: none;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
    </style>
</head>
<body>
 
    <div class="container">
        <aside class="sidebar">
            <h2>Skotial</h2>
            <nav>
                <ul> 
                    <li><a href="dashboard.html">Feed</a></li>
                    <li><a href="Friends.html">Friends</a></li>
                    <li><a href="Explore.html">Explore</a></li>
                    <li><a href="Create.html">Create</a></li>
                    <li><a href="Groups.html">Groups</a></li>
                    <li><a href="Profile.html">Profile</a></li>
                    <li><a href="Settings.html">Settings</a></li>

        

                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <header>
                <input type="text" placeholder="Search for posts, people...">
                <button>Add New Post</button>
            </header>
            <section class="stories">
                <div class="story">Story 1</div>
                <div class="story">Story 2</div>
                <div class="story">Story 3</div>
                <div class="story">Story 4</div>
            </section>
            <section class="post">
                <h3>@User</h3>
                <p>Important discussion about social media trends.</p>
                <img src="post-image.jpg" alt="Post Image">
                <div class="post-actions">
                    <button>Like</button>
                    <button>Comment</button>
                    <button>Share</button>
                </div>
            </section>
        </main>
        <aside class="right-sidebar">
            <h3>Friend Suggestions</h3>
            <ul>
                <li>Person 1</li>
                <li>Person 2</li>
                <li>Person 3</li>
            </ul>
            <h3>Profile Activity</h3>
            <p>+1,156 interactions this week</p>
        </aside>
    </div>
</body>
</html>
