<!DOCTYPE html>
<html>
<head>
<title>Profile Page</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  display: flex;
  width: 90%;
  max-width: 1400px;
  height: 90vh;
  background: white;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  overflow: hidden;
}

.sidebar {
  width: 20%;
  background: #4c60af;
  color: white;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.sidebar h2 {
  margin-bottom: 15px;
}

.sidebar ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

.sidebar li {
  padding: 10px;
  cursor: pointer;
  transition: background 0.3s;
}

.sidebar li:hover {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 5px;
}

.content {
  flex: 1;
  padding: 20px;
  background: #f5f5f5;
}

.profile-info {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
  justify-content: space-between;
  width: 100%;
  box-sizing: border-box;
}

.profile-image {
  width: 80px;
  height: 80px;
  border-radius: 50%;
}

.profile-image img {
  max-width: 100%;
  max-height: 100%;
  border-radius: 50%;
}

.profile-info h3 {
  margin-bottom: 5px;
}

.buttons {
  margin-bottom: 10px;
  display: flex;
  gap: 5px;
  justify-content: flex-start;
}

.buttons button {
  background-color: #4c60af;
  color: white;
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
  transition: background 0.3s;
}

.buttons button:hover {
  background: #3b4d8f;
}

.post-info {
  font-size: smaller;
  color: #555;
}
</style>
</head>
<body>

<div class="container">
  <div class="sidebar">
    <h2>PROFILE</h2>
    <ul>
      <li><a href="dashboard.html">Feed</a></li>
      <li><a href="Friends.html">Friends</a></li>
      <li><a href="Explore.html">Explore</a></li>
      <li><a href="Create.html">Create</a></li>
      <li><a href="Groups.html">Groups</a></li>
      <li><a href="Profile.html">Profile</a></li>
      <li><a href="Settings.html">Settings</a></li>
    </ul>
  </div>
  <div class="content">
    <div class="profile-info">
      <div class="profile-image">
        <img src="user.jpg" alt="Profile Picture">
      </div>
      <div>
        <h3>@JUAN</h3>
        <p>jhonyjhony</p>
        <div class="post-info">
          <p>12 Post 12 Friends 12 Following</p>
        </div>
      </div>
      <div class="buttons">
        <button>Edit Profile</button>
        <button>View Archive</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
