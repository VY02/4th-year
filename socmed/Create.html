<!DOCTYPE html>
<html>
<head>
<title>Create New Post</title>
<style>
body {
  font-family: sans-serif;
}
.container {
  width: 500px;
  margin: 0 auto;
  padding: 20px;
  border: 1px solid #ccc;
  border-radius: 5px;
  position: relative;
}
label {
  display: block;
  margin-bottom: 5px;
}
textarea, input[type="file"], input[type="text"] {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  border-radius: 5px;
}
button {
  background-color: #4c60af;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

#dashboardButton {
  position: absolute;
  top: 10px;
  right: 10px; 
  background-color: #ffffff;
  color: rgb(0, 0, 0);
  border: none;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
  text-decoration: none;
}
#preview {
  width: 100%;
  margin-bottom: 10px;
  border: 1px dashed #ccc;
  text-align: center;
  padding: 20px;
}
#preview img, #preview video, #preview audio {
  max-width: 100%;
  max-height: 300px;
  margin-bottom: 10px;
}
#preview p {
    text-align: center;
}
</style>
</head>
<body>
<div class="container">
  <h1>Create New Post</h1>
  <a id="dashboardButton" href="dashboard.html">X</a>
  <form action="#" method="post" enctype="multipart/form-data">
    <label for="media">Upload Media:</label>
    <input type="file" id="media" name="media" accept="image/*, video/*, audio/*">
    <div id="preview">
      <p>No media selected.</p>
    </div>

    <label for="content">Caption:</label>
    <textarea id="content" name="content" rows="4" required></textarea>

    <button type="submit">Create Post</button>
  </form>
</div>

<script>

  const mediaInput = document.getElementById('media');
  const previewContainer = document.getElementById('preview');

  mediaInput.addEventListener('change', function(event) {
    const file = event.target.files[0];
    const reader = new FileReader();
    previewContainer.innerHTML = '<p>Loading...</p>';

    if (file) {
      if (file.type.startsWith('image/')) {
        reader.onload = function(e) {
          previewContainer.innerHTML = `<img src="${e.target.result}" alt="Preview"><p id="preview-caption"></p>`;
          document.getElementById('content').addEventListener('input', function() {
              document.getElementById('preview-caption').textContent = this.value;
          });
        }
        reader.readAsDataURL(file);
      } else if (file.type.startsWith('video/')) {
        reader.onload = function(e) {
          previewContainer.innerHTML = `<video controls><source src="${e.target.result}" type="${file.type}"></video><p id="preview-caption"></p>`;
          document.getElementById('content').addEventListener('input', function() {
              document.getElementById('preview-caption').textContent = this.value;
          });
        }
        reader.readAsDataURL(file);
      } else if (file.type.startsWith('audio/')) {
          previewContainer.innerHTML = `<audio controls><source src="${URL.createObjectURL(file)}" type="${file.type}"></audio><p id="preview-caption"></p>`;
          document.getElementById('content').addEventListener('input', function() {
              document.getElementById('preview-caption').textContent = this.value;
          });
      } else {
        previewContainer.innerHTML = `<p>Unsupported file type or file too large for preview.</p>`;
      }
    } else {
      previewContainer.innerHTML = `<p>No media selected.</p>`;
    }
  });
</script>
</body>
</html>
